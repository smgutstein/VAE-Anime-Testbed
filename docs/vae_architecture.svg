<svg width="100%" viewBox="0 0 680 710" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    .th { font-size: 13px; font-weight: 500; }
    .ts { font-size: 11px; }
  </style>
</defs>

<!-- Input image: centred above encoder (cx=138) -->
<rect x="68" y="14" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="138" y="33" text-anchor="middle" dominant-baseline="central" class="th" fill="#444441">Input image</text>
<text x="138" y="49" text-anchor="middle" dominant-baseline="central" class="ts" fill="#5F5E5A">64 × 64 × 3</text>

<!-- Input → encoder top: straight vertical -->
<line x1="138" y1="58" x2="138" y2="80" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

<!-- ENCODER CONTAINER: x=10, w=256, right=266, cx=138 -->
<!-- Inner boxes x=18, w=240. Last box bottom=352, container bottom=375. -->
<rect x="10" y="80" width="256" height="295" rx="12" fill="#EEEDFE" fill-opacity="0.25" stroke="#534AB7" stroke-width="0.5"/>
<text x="34" y="100" dominant-baseline="central" class="th" fill="#3C3489">Encoder</text>

<!-- Enc layer 1: y=110..160 -->
<rect x="18" y="110" width="240" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="138" y="129" text-anchor="middle" dominant-baseline="central" class="th" fill="#3C3489">Conv2D + BN + LReLU</text>
<text x="138" y="147" text-anchor="middle" dominant-baseline="central" class="ts" fill="#534AB7">stride 2 → 32 × 32 × 32</text>
<line x1="138" y1="160" x2="138" y2="174" stroke="#534AB7" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

<!-- Enc layer 2: y=174..224 -->
<rect x="18" y="174" width="240" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="138" y="193" text-anchor="middle" dominant-baseline="central" class="th" fill="#3C3489">Conv2D + BN + LReLU</text>
<text x="138" y="211" text-anchor="middle" dominant-baseline="central" class="ts" fill="#534AB7">stride 2 → 16 × 16 × 64</text>
<line x1="138" y1="224" x2="138" y2="238" stroke="#534AB7" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

<!-- Enc layer 3: y=238..288 -->
<rect x="18" y="238" width="240" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="138" y="257" text-anchor="middle" dominant-baseline="central" class="th" fill="#3C3489">Conv2D + BN + LReLU</text>
<text x="138" y="275" text-anchor="middle" dominant-baseline="central" class="ts" fill="#534AB7">stride 2 → 8 × 8 × 128</text>
<line x1="138" y1="288" x2="138" y2="302" stroke="#534AB7" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

<!-- Enc dense: y=302..352, cx=138, bottom=352 -->
<rect x="18" y="302" width="240" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="138" y="321" text-anchor="middle" dominant-baseline="central" class="th" fill="#3C3489">Dense + BN + LReLU</text>
<text x="138" y="339" text-anchor="middle" dominant-baseline="central" class="ts" fill="#534AB7">flatten → 1024 units</text>

<!-- Purple arrows: exit encoder dense (138,352) straight down past encoder container
     bottom (y=375), turn right at y=385 (outside encoder), drop into mu/log_var tops. -->
<path d="M138 352 L138 385 L321 385 L321 400" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M138 352 L138 385 L405 385 L405 400" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- mu: x=285, w=72, right=357, cx=321, y=400..450 — centred in encoder/decoder gap -->
<rect x="285" y="400" width="72" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="321" y="419" text-anchor="middle" dominant-baseline="central" class="th" fill="#085041">mu</text>
<text x="321" y="437" text-anchor="middle" dominant-baseline="central" class="ts" fill="#0F6E56">latent_dim</text>

<!-- log_var: x=365, w=80, right=445, cx=405, y=400..450 — centred in encoder/decoder gap -->
<rect x="365" y="400" width="80" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="405" y="419" text-anchor="middle" dominant-baseline="central" class="th" fill="#085041">log var</text>
<text x="405" y="437" text-anchor="middle" dominant-baseline="central" class="ts" fill="#0F6E56">latent_dim</text>

<!-- mu/log_var → Sampling: both cx within sampling x=303..423, both go straight down -->
<line x1="321" y1="450" x2="321" y2="463" stroke="#0F6E56" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<line x1="405" y1="450" x2="405" y2="463" stroke="#0F6E56" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

<!-- Sampling: x=303, w=120, right=423, cx=363, y=465..515 — centred in encoder/decoder gap -->
<rect x="303" y="465" width="120" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="363" y="490" text-anchor="middle" dominant-baseline="central" class="th" fill="#085041">Sampling</text>

<!-- Formula centred under sampling cx=363 -->
<text x="363" y="535" text-anchor="middle" class="ts" fill="#0F6E56">z = mu + eps · exp(0.5 · log var),  eps ~ N(0, I)</text>

<!-- z → decoder: exits sampling RIGHT at (423, 490).
     RIGHT to x=452 — 7px right of log_var right(445), 8px left of decoder left(460). Clear.
     UP to y=135 — mid of first decoder layer. x=452 > log_var right(445). Clear.
     RIGHT to x=468 — decoder first layer left edge. -->
<path d="M423 490 L452 490 L452 135 L468 135" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- DECODER CONTAINER: x=460, w=200, h=359, bottom=439 — matches encoder bottom margin (23px) -->
<!-- Inner boxes: x=468, w=184, right=652. Sigmoid bottom=416, pad=439-416=23px ✓ -->
<rect x="460" y="80" width="200" height="359" rx="12" fill="#FAECE7" fill-opacity="0.25" stroke="#993C1D" stroke-width="0.5"/>
<text x="484" y="100" dominant-baseline="central" class="th" fill="#712B13">Decoder</text>

<!-- Dec dense: y=110..160, cx=560 -->
<rect x="468" y="110" width="184" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="560" y="129" text-anchor="middle" dominant-baseline="central" class="th" fill="#712B13">Dense + BN + LReLU</text>
<text x="560" y="147" text-anchor="middle" dominant-baseline="central" class="ts" fill="#993C1D">reshape → 8 × 8 × 128</text>
<line x1="560" y1="160" x2="560" y2="174" stroke="#993C1D" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

<!-- Dec deconv 1: y=174..224 -->
<rect x="468" y="174" width="184" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="560" y="193" text-anchor="middle" dominant-baseline="central" class="th" fill="#712B13">Conv2DT + LReLU</text>
<text x="560" y="211" text-anchor="middle" dominant-baseline="central" class="ts" fill="#993C1D">stride 2 → 16 × 16 × 128</text>
<line x1="560" y1="224" x2="560" y2="238" stroke="#993C1D" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

<!-- Dec deconv 2: y=238..288 -->
<rect x="468" y="238" width="184" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="560" y="257" text-anchor="middle" dominant-baseline="central" class="th" fill="#712B13">Conv2DT + LReLU</text>
<text x="560" y="275" text-anchor="middle" dominant-baseline="central" class="ts" fill="#993C1D">stride 2 → 32 × 32 × 64</text>
<line x1="560" y1="288" x2="560" y2="302" stroke="#993C1D" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

<!-- Dec deconv 3: y=302..352 -->
<rect x="468" y="302" width="184" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="560" y="321" text-anchor="middle" dominant-baseline="central" class="th" fill="#712B13">Conv2DT + LReLU</text>
<text x="560" y="339" text-anchor="middle" dominant-baseline="central" class="ts" fill="#993C1D">stride 2 → 64 × 64 × 32</text>

<!-- Last inner decoder box → sigmoid output (outside container) -->
<line x1="560" y1="352" x2="560" y2="364" stroke="#993C1D" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

<!-- Sigmoid output (inside container): y=366..416, gap from deconv3=14px ✓ -->
<rect x="468" y="366" width="184" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="560" y="385" text-anchor="middle" dominant-baseline="central" class="th" fill="#712B13">Conv2DT + sigmoid</text>
<text x="560" y="403" text-anchor="middle" dominant-baseline="central" class="ts" fill="#993C1D">64 × 64 × 3</text>

<!-- Sigmoid → output image -->
<line x1="560" y1="416" x2="560" y2="540" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

<!-- Output image: cx=560 -->
<rect x="490" y="540" width="140" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="560" y="559" text-anchor="middle" dominant-baseline="central" class="th" fill="#444441">Output image</text>
<text x="560" y="577" text-anchor="middle" dominant-baseline="central" class="ts" fill="#5F5E5A">64 × 64 × 3</text>

<!-- Legend -->
<rect x="10" y="622" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="28" y="629" dominant-baseline="central" class="ts" fill="#5F5E5A">Encoder</text>
<rect x="110" y="622" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="128" y="629" dominant-baseline="central" class="ts" fill="#5F5E5A">Latent space</text>
<rect x="240" y="622" width="12" height="12" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="258" y="629" dominant-baseline="central" class="ts" fill="#5F5E5A">Decoder</text>
<rect x="355" y="622" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="373" y="629" dominant-baseline="central" class="ts" fill="#5F5E5A">Image</text>
</svg>
