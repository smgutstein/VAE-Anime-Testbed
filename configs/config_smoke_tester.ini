[Training_Parameters]
epochs = 5
learning_rate = 0.002
# adaptive_kl or fixed_beta
loss_policy = fixed_beta
beta = 100.0


[Output_Parameters]
parent_dir = ./expts
git_status_file = git_status.txt
save_net = false
expt_name = Beta_100

[Data_Parameters]
data_dir = ./data/anime
batch_size = 1500
image_size = 64
val_split = 0.2
shuffle_buffer = 1000
train_drop_remainder = true

[Model_Parameters]
latent_dim = 512
base_filters = 32
# Exactly 3 entries required for the current fixed 3-stage architecture
filter_factors = 1,2,4   
encode_dense_units = 1024
kernel_size = 3

[Monitoring_Parameters]
snapshot_every = 10
train_preview_count = 25
valid_preview_count = 18
take_initial_snapshot = true
run_analysis = true
make_mu_log_var_movies = false
flush_every_epochs = 100

[Safety_Parameters]
max_grad_norm = 5.0
step_guard_kl_jump_ratio_threshold = 100.0
step_guard_kl_abs_threshold = 1000000.0
step_guard_max_log_var_threshold = 20.0
tripwire_lr_backoff = 0.5
tripwire_lr_floor = 1e-6
max_consecutive_tripwires = 3

[Reproducibility]
seed = 1234
deterministic = false